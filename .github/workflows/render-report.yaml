name: render-report

concurrency:
  group: pages
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.pdf"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render-report:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repos
        uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          brew install gettext libpng
          mkdir -p ~/.R
          echo "CPPFLAGS += -I$(brew --prefix gettext)/include -I$(brew --prefix libpng)/include" >> ~/.R/Makevars
          echo "LDFLAGS += -L$(brew --prefix gettext)/lib -L$(brew --prefix libpng)/lib" >> ~/.R/Makevars

      - name: Install dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Compile the report
        run: quarto render report/manuscript.qmd

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp report/manuscript.html _site/index.html
          if [ -d report/manuscript_files ]; then
            cp -R report/manuscript_files _site/manuscript_files
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: render-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
